apiVersion: v1
kind: Namespace
metadata:
  name: erm-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-health
  namespace: erm-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-health}
  template:
    metadata:
      labels: {app: api-health}
    spec:
      containers:
        - name: api
          image: erm-api:day1
          imagePullPolicy: Never
          env:
            - name: ERM_INTERNAL_SECRET
              valueFrom:
                secretKeyRef: {name: erm-smoke, key: ERM_INTERNAL_SECRET}
            - name: ERM_COORDINATOR_URL
              value: http://coordinator:8081
          ports:
            - containerPort: 8080
          # Bootstrap smoke only: business readiness is deliberately not claimed.
          readinessProbe:
            httpGet: {path: /health/live, port: 8080}
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-health
  namespace: erm-smoke
spec:
  selector: {app: api-health}
  ports:
    - port: 8080
      targetPort: 8080
