name: erm-dev
services:
  api:
    image: erm-api:day4
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args: {SERVICE: api}
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET:?Set internal secret}
      ERM_COORDINATOR_URL: http://coordinator:8081
      ERM_AMQP_URL: amqp://erm:${ERM_BROKER_PASSWORD}@broker:5672/
    ports: ["127.0.0.1:8080:8080"]
  coordinator:
    image: erm-coordinator:day4
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args: {SERVICE: coordinator}
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET:?Set internal secret}
      ERM_CONTROL_FILE: /control/routes.json
      ERM_NODE_0a_URL: http://node-0a:8082
      ERM_NODE_0b_URL: http://node-0b:8082
      ERM_NODE_1a_URL: http://node-1a:8082
      ERM_NODE_1b_URL: http://node-1b:8082
      ERM_NODE_2a_URL: http://node-2a:8082
      ERM_NODE_2b_URL: http://node-2b:8082
    ports: ["127.0.0.1:8081:8081"]
    volumes: [coordinator-control:/control]
  node-0a:
    image: erm-storage-node:day4
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args: {SERVICE: storage-node}
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET}
      ERM_DATABASE_URL: postgres://erm:${ERM_DB_PASSWORD}@db-0a:5432/erm?sslmode=disable
      ERM_NODE_ID: node-0a
      ERM_SHARD_ID: "0"
      ERM_COORDINATOR_URL: http://coordinator:8081
    depends_on:
      db-0a: {condition: service_healthy}
  db-0a:
    image: postgis/postgis:17-3.7@sha256:1f0d64ef12bfb344d3569ab6419aca183258b146951daec83f0585d01e6c9cc9
    entrypoint: [bash, /config/start-node.sh]
    environment:
      POSTGRES_USER: erm
      POSTGRES_PASSWORD: ${ERM_DB_PASSWORD:?Set DB password}
      POSTGRES_DB: erm
      REPLICATION_PASSWORD: ${ERM_REPLICATION_PASSWORD:?Set replication password}
      PGPASSWORD: ${ERM_REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      BOOTSTRAP_ROLE: primary
      PRIMARY_HOST: db-0a
      NODE_ID: node-0a
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - db-0a:/var/lib/postgresql/data
      - ../postgres:/config:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U erm -d erm"]
      interval: 2s
      timeout: 2s
      retries: 30
  node-0b:
    image: erm-storage-node:day4
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET}
      ERM_DATABASE_URL: postgres://erm:${ERM_DB_PASSWORD}@db-0b:5432/erm?sslmode=disable
      ERM_NODE_ID: node-0b
      ERM_SHARD_ID: "0"
      ERM_COORDINATOR_URL: http://coordinator:8081
    depends_on:
      db-0b: {condition: service_healthy}
  db-0b:
    image: postgis/postgis:17-3.7@sha256:1f0d64ef12bfb344d3569ab6419aca183258b146951daec83f0585d01e6c9cc9
    entrypoint: [bash, /config/start-node.sh]
    environment:
      POSTGRES_USER: erm
      POSTGRES_PASSWORD: ${ERM_DB_PASSWORD:?Set DB password}
      POSTGRES_DB: erm
      REPLICATION_PASSWORD: ${ERM_REPLICATION_PASSWORD:?Set replication password}
      PGPASSWORD: ${ERM_REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      BOOTSTRAP_ROLE: standby
      PRIMARY_HOST: db-0a
      NODE_ID: node-0b
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - db-0b:/var/lib/postgresql/data
      - ../postgres:/config:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U erm -d erm"]
      interval: 2s
      timeout: 2s
      retries: 30
  node-1a:
    image: erm-storage-node:day4
