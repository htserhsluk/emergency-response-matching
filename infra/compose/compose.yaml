  matching:
    image: erm-matching:day4
    build:
      context: ../..
      dockerfile: infra/Dockerfile
      args: {SERVICE: matching}
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET}
      ERM_COORDINATOR_URL: http://coordinator:8081
      ERM_AMQP_URL: amqp://erm:${ERM_BROKER_PASSWORD}@broker:5672/
    depends_on:
      broker: {condition: service_healthy}
      coordinator: {condition: service_started}
  broker:
    image: rabbitmq:4.4.0-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    hostname: broker
    environment:
      RABBITMQ_DEFAULT_USER: erm
      RABBITMQ_DEFAULT_PASS: ${ERM_BROKER_PASSWORD:?Set broker password}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [broker-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  broker-data:
  coordinator-control:
  db-0a:
  db-0b:
  db-1a:
  db-1b:
  db-2a:
  db-2b:
