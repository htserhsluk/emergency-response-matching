  node-2a:
    image: erm-storage-node:day4
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET}
      ERM_DATABASE_URL: postgres://erm:${ERM_DB_PASSWORD}@db-2a:5432/erm?sslmode=disable
      ERM_NODE_ID: node-2a
