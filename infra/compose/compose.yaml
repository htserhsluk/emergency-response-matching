  node-2b:
    image: erm-storage-node:day4
    environment:
      ERM_INTERNAL_SECRET: ${ERM_INTERNAL_SECRET}
      ERM_DATABASE_URL: postgres://erm:${ERM_DB_PASSWORD}@db-2b:5432/erm?sslmode=disable
