name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.7@sha256:1f0d64ef12bfb344d3569ab6419aca183258b146951daec83f0585d01e6c9cc9
        env:
          POSTGRES_USER: erm
          POSTGRES_PASSWORD: integration-fixture-only
          POSTGRES_DB: erm
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -h 127.0.0.1 -U erm -d erm" --health-interval 2s --health-timeout 2s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
        env:
          RABBITMQ_DEFAULT_USER: erm
          RABBITMQ_DEFAULT_PASS: integration-fixture-only
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      ERM_TEST_DATABASE_URL: postgres://erm:integration-fixture-only@127.0.0.1:55432/erm?sslmode=disable
      GOOSE_DBSTRING: postgres://erm:integration-fixture-only@127.0.0.1:55432/erm?sslmode=disable
      GOOSE_DRIVER: postgres
      ERM_TEST_AMQP_URL: amqp://erm:integration-fixture-only@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go install -tags='no_clickhouse,no_libsql,no_mssql,no_mysql,no_sqlite3,no_vertica,no_ydb' github.com/pressly/goose/v3/cmd/goose@v3.29.0
      - run: goose -dir migrations up
      - run: go build ./cmd/...
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go test -tags=broker ./internal/broker -count=1 -v
      - run: go test -race -tags=integration,broker ./tests/integration/... -count=1 -v
